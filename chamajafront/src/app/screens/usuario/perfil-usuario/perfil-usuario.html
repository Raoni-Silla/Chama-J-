<app-navbarlogged></app-navbarlogged>

<div class="config-layout">

  <!-- Sidebar de Navegação -->
  <aside class="config-sidebar">
    <nav class="nav-abas">
      <button class="aba-btn" [class.active]="abaAtiva === 'perfil'" (click)="mudarAba('perfil')">Perfil
        Público</button>
      <button class="aba-btn" [class.active]="abaAtiva === 'conta'" (click)="mudarAba('conta')">Conta</button>
      <button class="aba-btn" [class.active]="abaAtiva === 'enderecos'"
        (click)="mudarAba('enderecos')">Endereços</button>
      <button class="aba-btn" [class.active]="abaAtiva === 'cartoes'" (click)="mudarAba('cartoes')">Cartões</button>
    </nav>
  </aside>

  <main class="config-content">

    @switch (abaAtiva) {

    <!-- ========================================== -->
    <!-- TELA 1: PERFIL PÚBLICO          -->
    <!-- ========================================== -->
    @case ('perfil') {
    <app-aba-perfil-publico></app-aba-perfil-publico>
    }

    <!-- ========================================== -->
    <!-- TELA 2: CONTA                              -->
    <!-- ========================================== -->
    @case ('conta') { 
    <app-aba-conta></app-aba-conta>
    }

    <!-- ========================================== -->
    <!-- TELA 3: ENDEREÇOS                          -->
    <!-- ========================================== -->
    @case ('enderecos') {
    <app-aba-enderecos></app-aba-enderecos>
    }

    <!-- ========================================== -->
    <!-- TELA 4: CARTÕES                            -->
    <!-- ========================================== -->
    @case ('cartoes') {
    <div class="tela-cartoes">
      <h2>Meus Cartões</h2>
      <p>Gerenciamento de pagamentos entra aqui.</p>
    </div>
    }
    }

  </main>
</div>
